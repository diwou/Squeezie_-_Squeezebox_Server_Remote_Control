; PlatformIO Project Configuration File
; Squeezie — ESP32-S3-WROOM1 N16R8 mit ILI9488 Touchdisplay
;
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.filesystem = littlefs
; upload_port = /dev/ttyACM0
upload_protocol = espota
upload_port = 10.10.60.123
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.extra_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

extra_scripts =
    pre:suppress_lib_warnings.py
    post:generate_compiledb.py
    post:scripts/export_firmware.py

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM

; WebServer (Legacy) wird von LDF fälschlicherweise eingebunden → ignorieren
; ESPAsyncWebServer benötigt ihn nicht (eigene Request-Behandlung)
lib_ignore = WebServer

lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.3.0
    mathieucarbou/AsyncTCP@^3.2.0
    bblanchon/ArduinoJson@^7.2.0
    lovyan03/LovyanGFX@1.1.12
